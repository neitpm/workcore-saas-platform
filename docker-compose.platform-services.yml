name: workcore-platform-services

services:
  provisioning-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: workcore-platform-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:55400:55400"
    environment:
      PLATFORM_PROVISION_PORT: 55400
      PLATFORM_SUPABASE_URL: ${PLATFORM_SUPABASE_URL:-http://host.docker.internal:55321}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY in .env.platform}
    extra_hosts:
      - "host.docker.internal:host-gateway"
  platform-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: workcore-platform-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      provisioning-api:
        condition: service_started
